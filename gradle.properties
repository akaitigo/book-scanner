org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Every module declares a Java 17 toolchain, so the JDK a developer happens to
# launch Gradle with does not change what gets compiled. If your JDK 17 lives
# somewhere Gradle cannot auto-detect (mise, asdf, sdkman), point it there from
# ~/.gradle/gradle.properties rather than here — that path is machine-specific:
#   org.gradle.java.installations.paths=/path/to/jdk-17
org.gradle.java.installations.auto-detect=true

android.useAndroidX=true
android.nonTransitiveRClass=true
