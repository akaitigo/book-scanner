name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Robolectric fetches its Android runtime jars at *test* time, outside
      # Gradle's dependency resolution, so a transient network failure fails
      # every Robolectric class at once with a bare `classMethod` error rather
      # than anything diagnosable. That happened on 2026-08-11 and reddened a
      # commit whose code was fine. Caching them makes repeat runs immune.
      - name: Cache Robolectric runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      # Every acceptance gate this project relies on — PDF validity, output
      # size, geometry — runs here. The runners have no /dev/kvm, so there is
      # no emulator job; see docs/adr/0007-pdf-export-jpeg-passthrough.md.
      - name: Verify
        run: ./scripts/verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

      - name: Collect measurements
        if: always()
        run: |
          echo '### Measured gates' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -rho 'MEASURE[^<&]*' --include='*.xml' . >> "$GITHUB_STEP_SUMMARY" || \
            echo 'no measurements recorded' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The debug APK is signed with the standard debug key, so it installs by
      # sideloading without any signing secret in this repository. It is the
      # build to put on a device for the checks CI cannot make: camera capture,
      # predictive back, text scaling, and how a real exported PDF looks.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: book-scanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
